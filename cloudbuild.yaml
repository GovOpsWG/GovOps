substitutions:
  _AR_HOST: us-central1-docker.pkg.dev
  _REGION: us-central1
  _REPO: cloud-run-source-deploy
  _SERVICE: govops-info
  _SITE_URL: https://govops.info
  _RUN_SA_NAME: govops-info-run

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=2
      - --memory=512Mi
      - --cpu=1
      - --port=8080
      - --service-account=${_RUN_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=SITE_URL=${_SITE_URL}

images:
  - ${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_AR_HOST}/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
